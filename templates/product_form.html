{% extends "base.html" %}
{% block title %}{{ mode }} Product{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
<div class="card shadow-sm"><div class="card-body">
  <h4 class="mb-3">{{ mode }} Product</h4>
  <form method="post">
    <div class="mb-3"><label class="form-label">Name</label>
      <input name="name" class="form-control" value="{{ product.get('name','') }}" required></div>
    <div class="row">
      <div class="col mb-3"><label class="form-label">Price (₹)</label>
        <input name="price" type="number" step="0.01" min="0" class="form-control" value="{{ product.get('price','') }}" required></div>
      <div class="col mb-3"><label class="form-label">Quantity</label>
        <input name="quantity" type="number" min="0" class="form-control" value="{{ product.get('quantity','') }}" required></div>
    </div>
    <div class="row">
      <div class="col mb-3"><label class="form-label">Low-stock alert at</label>
        <input name="low_stock_threshold" type="number" min="0" class="form-control" value="{{ product.get('low_stock_threshold', 5) }}"></div>
      <div class="col mb-3"><label class="form-label">Expiry date (optional)</label>
        <input name="expiry_date" type="date" class="form-control" value="{{ product.get('expiry_date') or '' }}"></div>
    </div>
    <button class="btn btn-primary">Save</button>
    <a class="btn btn-link" href="{{ url_for('products') }}">Cancel</a>
  </form>
</div></div></div></div>
{% endblock %}
