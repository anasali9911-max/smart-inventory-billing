{% extends "base.html" %}
{% block title %}Sales{% endblock %}
{% block content %}
<h3 class="mb-3">Sales History</h3>
<table class="table table-striped bg-white">
  <thead><tr><th>Bill #</th><th>Date</th><th>Customer</th><th>Cashier</th><th>Total</th><th></th></tr></thead>
  <tbody>
  {% for s in sales %}
    <tr><td>{{ s.id }}</td><td>{{ s.created_at }}</td><td>{{ s.customer }}</td><td>{{ s.username }}</td>
      <td>₹{{ '%.2f'|format(s.total) }}</td>
      <td><a class="btn btn-sm btn-outline-primary" href="{{ url_for('invoice', sale_id=s.id) }}">View</a></td></tr>
  {% else %}<tr><td colspan="6" class="text-center text-muted">No sales yet.</td></tr>{% endfor %}
  </tbody></table>
{% endblock %}
