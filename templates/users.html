{% extends "base.html" %}
{% block title %}Staff{% endblock %}
{% block content %}
<h3 class="mb-3">Staff Accounts</h3>
<div class="row g-4">
  <div class="col-md-6"><table class="table bg-white">
    <thead><tr><th>Username</th><th>Role</th></tr></thead>
    <tbody>{% for u in users %}<tr><td>{{ u.username }}</td><td>{{ u.role }}</td></tr>{% endfor %}</tbody></table></div>
  <div class="col-md-6"><div class="card"><div class="card-body">
    <h6>Add user</h6>
    <form method="post">
      <input name="username" class="form-control mb-2" placeholder="Username" required>
      <input name="password" type="password" class="form-control mb-2" placeholder="Password (min 6 chars)" required>
      <select name="role" class="form-select mb-2"><option value="staff">Staff</option><option value="admin">Admin</option></select>
      <button class="btn btn-primary">Create</button>
    </form></div></div></div>
</div>
{% endblock %}
