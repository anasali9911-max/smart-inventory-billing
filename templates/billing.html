{% extends "base.html" %}
{% block title %}New Bill{% endblock %}
{% block content %}
<h3 class="mb-3">New Bill</h3>
<form method="post" id="billForm">
  <div class="mb-3 col-md-4"><label class="form-label">Customer (optional)</label>
    <input name="customer" class="form-control" placeholder="Walk-in"></div>
  <table class="table bg-white align-middle">
    <thead><tr><th style="width:50%">Product</th><th>Qty</th><th>Price</th><th>Line total</th><th></th></tr></thead>
    <tbody id="rows"></tbody>
    <tfoot><tr><th colspan="3" class="text-end">Grand Total</th><th id="grand">₹0.00</th><th></th></tr></tfoot>
  </table>
  <button type="button" class="btn btn-outline-primary" id="addRow">+ Add item</button>
  <button class="btn btn-success">Generate Bill</button>
</form>
{% endblock %}
{% block scripts %}
<script>
const products = {{ products|tojson }};
const rows = document.getElementById('rows');
const fmt = n => '₹' + n.toFixed(2);

function addRow() {
  const tr = document.createElement('tr');
  const opts = products.map(p => `<option value="${p.id}">${p.name} (stock ${p.quantity})</option>`).join('');
  tr.innerHTML = `
    <td><select name="product_id" class="form-select" required><option value="">-- select --</option>${opts}</select></td>
    <td><input name="qty" type="number" min="1" value="1" class="form-control" style="width:90px" required></td>
    <td class="price">-</td><td class="line">-</td>
    <td><button type="button" class="btn btn-sm btn-outline-danger rm">×</button></td>`;
  rows.appendChild(tr);
}
function recalc() {
  let grand = 0;
  rows.querySelectorAll('tr').forEach(tr => {
    const p = products.find(x => x.id == tr.querySelector('select').value);
    const q = parseInt(tr.querySelector('input').value) || 0;
    if (p) {
      tr.querySelector('input').max = p.quantity;
      tr.querySelector('.price').textContent = fmt(p.price);
      tr.querySelector('.line').textContent = fmt(p.price * q);
      grand += p.price * q;
    } else { tr.querySelector('.price').textContent = '-'; tr.querySelector('.line').textContent = '-'; }
  });
  document.getElementById('grand').textContent = fmt(grand);
}
document.getElementById('addRow').onclick = () => { addRow(); recalc(); };
rows.addEventListener('input', recalc);
rows.addEventListener('click', e => { if (e.target.classList.contains('rm')) { e.target.closest('tr').remove(); recalc(); } });
addRow();
</script>
{% endblock %}
